<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Analytics</title>
</head>
<body>
<h1>📈 Live Kafka Analytics</h1>
<ul id="analytics"></ul>

<script>
    const eventSource = new EventSource("/analytics-stream");
    eventSource.onmessage = function(event) {
        const li = document.createElement("li");
        li.textContent = event.data;
        document.getElementById("analytics").appendChild(li);
    };
</script>
</body>
</html>
